name: Build CustomGram

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Inject Telegram API credentials
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          path = Path("TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java")
          text = path.read_text(encoding="utf-8")
          api_id = os.environ["TELEGRAM_API_ID"]
          api_hash = os.environ["TELEGRAM_API_HASH"]
          if not api_id.isdigit(): raise SystemExit("TELEGRAM_API_ID is missing or invalid")
          if not api_hash: raise SystemExit("TELEGRAM_API_HASH is missing")
          text, id_count = re.subn(r'public static int APP_ID = \d+;', f'public static int APP_ID = {api_id};', text, count=1)
          text, hash_count = re.subn(r'public static String APP_HASH = "[^"]*";', f'public static String APP_HASH = "{api_hash}";', text, count=1)
          if id_count != 1 or hash_count != 1: raise SystemExit(f"BuildVars patch failed: APP_ID={id_count}, APP_HASH={hash_count}")
          path.write_text(text, encoding="utf-8")
          print("Telegram API credentials injected.")
          PY

      - name: Apply CustomGram patches
        run: |
          python3 tools/patch_local_changes.py
          python3 tools/patch_customgram_ui.py
          grep -q "CUSTOMGRAM_LOCAL_CHANGES_MENU" TMessagesProj/src/main/java/org/telegram/ui/ProfileActivity.java
          grep -q "CUSTOMGRAM_LOCAL_NAME_GLOBAL" TMessagesProj/src/main/java/org/telegram/messenger/UserObject.java
          grep -q "CUSTOMGRAM_LOCAL_STATUS_GLOBAL" TMessagesProj/src/main/java/org/telegram/messenger/LocaleController.java
          grep -q "CUSTOMGRAM_SETTINGS_HUB_ROW" TMessagesProj/src/main/java/org/telegram/ui/SettingsActivity.java
          grep -q "CUSTOMGRAM_REMINDER_RECEIVERS" TMessagesProj/config/release/AndroidManifest_standalone.xml
          echo "CustomGram patches verified."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Telegram Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          tags: customgram-builder:latest
          load: true
          cache-from: type=gha,scope=customgram-builder
          cache-to: type=gha,scope=customgram-builder,mode=max

      - name: Build APK
        run: |
          docker run --rm -v "$PWD:/home/source" customgram-builder:latest

      - name: Find APK
        if: always()
        run: |
          echo "Generated APK files:"
          find TMessagesProj -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CustomGram-APK
          path: |
            TMessagesProj/build/outputs/apk/**/*.apk
          if-no-files-found: error
